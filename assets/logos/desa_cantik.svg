<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="100%" height="100%">
  <!-- Leaf and House / Data Chart Symbol -->
  <g transform="translate(10, 10)">
    <!-- House outline / Chart bars -->
    <rect x="10" y="35" width="12" height="35" rx="3" fill="#0072BC"/>
    <rect x="26" y="20" width="12" height="50" rx="3" fill="#00A859"/>
    <rect x="42" y="10" width="12" height="60" rx="3" fill="#F7941D"/>
    <!-- Organic Leaf overhead -->
    <path d="M 12,25 C 10,5 35,2 55,10 C 65,15 65,30 50,32 C 35,34 18,35 12,25 Z" fill="#7BC143" opacity="0.9"/>
    <path d="M 20,22 Q 40,16 52,14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(80, 20)">
    <text x="0" y="25" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#0072BC" letter-spacing="0.5">
      Desa
    </text>
    <text x="0" y="52" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="25" font-weight="900" fill="#E53935" letter-spacing="0.5">
      Cantik
    </text>
    <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#2E7D32" letter-spacing="1">
      DESA CINTA STATISTIK
    </text>
  </g>
</svg>
