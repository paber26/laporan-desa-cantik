<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <!-- BPS Symbol -->
  <g transform="translate(10, 10)">
    <!-- Top left diamond (cyan/blue) -->
    <polygon points="40,5 75,40 40,75 5,40" fill="#0093DD" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Top right diamond (orange) -->
    <polygon points="75,40 110,5 75,-30 40,5" fill="#F37021" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>
    <!-- Bottom diamond (green) -->
    <polygon points="75,40 110,75 75,110 40,75" fill="#8DC63F" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Overlay stylized segments -->
    <path d="M 40,5 L 75,40 L 40,75 Z" fill="#0072BC" />
    <path d="M 75,40 L 110,75 L 75,110 Z" fill="#66A030" />
    <path d="M 75,40 L 110,5 L 75,-30 Z" fill="#E65100" />
    <!-- Dynamic curve ribbon -->
    <path d="M 15,35 Q 45,70 100,55" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- BPS Typography -->
  <g transform="translate(130, 25)">
    <text x="0" y="32" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#003366">
      BADAN PUSAT STATISTIK
    </text>
    <text x="0" y="62" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#D32F2F">
      KABUPATEN MINAHASA SELATAN
    </text>
  </g>
</svg>
