<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <!-- Blue Circular Official Stamp -->
  <g transform="translate(10, 15)">
    <!-- Outer Double Circles -->
    <circle cx="70" cy="70" r="65" fill="none" stroke="#254BA7" stroke-width="2.5" opacity="0.85"/>
    <circle cx="70" cy="70" r="60" fill="none" stroke="#254BA7" stroke-width="1.2" opacity="0.85"/>
    
    <!-- Curved Stamp Text Path -->
    <path id="stampUpperPath" d="M 18,70 A 52,52 0 1,1 122,70" fill="none"/>
    <path id="stampLowerPath" d="M 122,70 A 52,52 0 0,1 18,70" fill="none"/>
    
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#254BA7" opacity="0.9">
      <textPath href="#stampUpperPath" startOffset="50%" text-anchor="middle">
        BADAN PUSAT STATISTIK
      </textPath>
    </text>
    
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#254BA7" opacity="0.9">
      <textPath href="#stampLowerPath" startOffset="50%" text-anchor="middle">
        ★ KAB. MINAHASA SELATAN ★
      </textPath>
    </text>

    <!-- Center BPS Symbol in Stamp -->
    <polygon points="70,45 86,60 70,75 54,60" fill="none" stroke="#254BA7" stroke-width="2" opacity="0.9"/>
    <polygon points="86,60 102,45 86,30 70,45" fill="none" stroke="#254BA7" stroke-width="2" opacity="0.9"/>
    <polygon points="86,60 102,75 86,90 70,75" fill="none" stroke="#254BA7" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Signature Curve Overlay (Dark Blue Ink) -->
  <g transform="translate(100, 40)" opacity="0.95">
    <path d="M 20,40 C 40,-10 65,30 80,10 C 95,-10 110,60 130,25 C 145,5 160,20 180,35 M 45,35 Q 90,80 170,25 M 65,30 L 150,30" 
          fill="none" stroke="#1A237E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
